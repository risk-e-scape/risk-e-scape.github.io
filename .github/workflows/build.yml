name: Build, Test and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and run tests
        run: npm test

      - name: Verify docs/ exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: docs/ directory not created"
            exit 1
          fi

      - name: Verify core pages exist
        run: |
          for f in docs/index.html docs/course/index.html docs/privacy/index.html docs/verify/index.html docs/404.html docs/.nojekyll docs/sitemap.xml docs/robots.txt; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing required file: $f"
              exit 1
            fi
          done
          echo "All core pages present."

      - name: Report certificate pages generated
        run: |
          if [ -d "docs/c" ]; then
            COUNT=$(find docs/c -name "index.html" | wc -l)
          else
            COUNT=0
          fi
          echo "Generated $COUNT certificate pages"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Check formatting (basic)
        run: |
          if git ls-files --eol | grep -q "w/crlf"; then
            echo "WARNING: CRLF line endings detected in tracked files"
          fi
          if git grep -n "[[:space:]]$" -- "*.js" "*.json" "*.html" "*.css" "*.md" "*.sh" "*.bat" 2>/dev/null; then
            echo "ERROR: Trailing whitespace found"
            exit 1
          fi

  deploy:
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    needs: [build-and-test, lint]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
